name: Digest semanal MeuVoto

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar nodemailer
        run: npm install nodemailer --no-save

      - name: Enviar digest (o script sai sem erro se faltar segredo)
        env:
          DIGEST_API: ${{ secrets.DIGEST_API }}
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node scripts/digest-send.js