<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="t d">
<title id="t">MeuVoto</title>
<desc id="d">Smartphone MeuVoto com check verde.</desc>
<defs>
<linearGradient id="gPhone" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1e6fb6"/>
<stop offset="1" stop-color="#0b3f6e"/>
</linearGradient>
<linearGradient id="gCheck" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#2ecc71"/>
<stop offset="1" stop-color="#16a34a"/>
</linearGradient>
<linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eaf3fb"/>
<stop offset="1" stop-color="#cfe2f3"/>
</linearGradient>
</defs>
<!-- Smartphone body -->
<rect x="15" y="5" width="70" height="90" rx="14" fill="url(#gPhone)"/>
<!-- Screen -->
<rect x="22" y="14" width="56" height="72" rx="6" fill="url(#gScreen)"/>
<!-- Camera top -->
<circle cx="50" cy="10" r="2.5" fill="#9bd0e8"/>
<!-- Home indicator -->
<rect x="42" y="92" width="16" height="2" rx="1" fill="url(#gScreen)" opacity="0.6"/>
<!-- Check/V mark -->
<path d="M32 52 L44 64 L68 40" fill="none" stroke="url(#gCheck)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>