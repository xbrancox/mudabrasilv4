<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MeuVoto · Cédula de Votação 2026</title>
<meta name="description" content="Sistema de votação e revogação de voto para Eleições 2026">
<meta property="og:title" content="MeuVoto · Cédula de Votação 2026">
<meta property="og:description" content="Sistema cívico de votação e revogação">
<meta property="og:type" content="website">
<meta property="og:url" content="http://localhost:8080/cedula-votabrasil.html">
<meta property="og:image" content="https://meu-voto.app/og-image.png">
<meta property="og:site_name" content="MeuVoto">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://meu-voto.app/og-image.png">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="../config.local.js?v=2"></script>
<script src="../js/site-header.js?v=6"></script>
<style>
:root{--bg:#061a3a;--card:#0d2242;--card2:#123059;--line:rgba(127,176,245,.22);--ink:#fff;--muted:#94A3B8;--gold:#FFD700;--blue:#115FCB;--blueL:#4a90f0;--green:#2ECC71;--red:#E74C3C;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
h1{font-family:Montserrat;font-weight:900;font-size:26px;margin:8px 0}
.kick{color:var(--gold);font:800 11px Manrope;letter-spacing:.2em;text-transform:uppercase}
.muted{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 13px Manrope;padding:10px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,#FFD700,#FFA500);border:none;color:#1a1400}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:500 14px Manrope;width:100%}
.filtros{display:grid;grid-template-columns:2fr 1.4fr .7fr 1.2fr auto;gap:10px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:top;background:var(--card2);flex:none}
.badge{font:800 10px Manrope;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
/* Modal de confirmação: overlay fixo sobre a página. Sem estas regras o
   <div class="modal hidden"> vazava no meio do layout e os botões
   "Cancelar"/"Confirmar" apareciam sempre, sem o modal ser acionado. */
.modal{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(2,10,26,.78);backdrop-filter:blur(3px)}
.modal.hidden{display:none}
.modal-content{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.candidate-info{margin:14px 0 6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Cédula de Votação 2026</h1>

<p class="muted">Escolha um cargo para visualizar os candidatos:</p>

<div class="filtros">
  <div>
    <!-- O value precisa ser o CÓDIGO do cargo no TSE: a API filtra por
         String(c.cargo) === q.cargo. Mandar o rótulo ("Presidente") não
         casava com nada e a lista vinha vazia. -->
    <select id="cargo-select">
      <option value="1">Presidente</option>
      <option value="3">Governador</option>
      <option value="5">Senador</option>
      <option value="6">Dep. Federal</option>
      <option value="7">Dep. Estadual</option>
    </select>
  </div>
  <div>
    <!-- value="" = todos os UFs: a API compara c.uf === q.uf, então o
         literal "all" também zerava o resultado. -->
    <select id="uf-select">
      <option value="">Todos os UFs</option>
      <option value="SP">São Paulo</option>
      <option value="RJ">Rio de Janeiro</option>
      <option value="MG">Minas Gerais</option>
      <option value="BA">Bahia</option>
    </select>
  </div>
  <button class="btn gold" onclick="buscar(1)">Buscar</button>
</div>

<div id="aviso" style="display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.35);font-size:13px"></div>
<div id="info" class="muted">Selecione um cargo acima para começar.</div>
<div class="grid" id="lista" style="margin-top:12px"></div>

<div class="pager" style="margin-top:20px">
  <button class="btn sm" id="pgAnt" onclick="buscar(page-1)" disabled>‹ Anterior</button>
  <span class="muted" id="pgInfo">—</span>
  <button class="btn sm" id="pgProx" onclick="buscar(page+1)" disabled>Próxima ›</button>
</div>
</div>
</div>

<!-- Modal de confirmação -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Confirmar Voto</h2>
    <img id="confirm-photo" class="av" alt="" style="display:none">
    <div class="candidate-info">
      <h3 id="confirm-name"></h3>
      <p id="confirm-party"></p>
    </div>
    <p class="muted">Deseja confirmar seu voto neste candidato?</p>
    <div style="display:flex;gap:12px;margin-top:20px">
      <button id="cancel-vote" class="btn">Cancelar</button>
      <button id="confirm-vote" class="btn gold">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* API Base - usa variável global da config se definida */
const API = (window.MeuVoto && typeof window.MeuVoto.API_BASE === 'string') ? window.MeuVoto.API_BASE : 'http://localhost:8080';

const UFS = ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA','MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN','RO','RR','RS','SC','SE','SP','TO'];
const $ = s => document.querySelector(s);

let page = 1, total = 0, LAST = [], SNAP = null, PS = 50;
let modoDemo = true; // Assume modo demo se não conectar à API

/* Faixa de aviso (usada no fallback de snapshot e na confirmação de voto) */
function aviso(m) {
  const a = $('#aviso');
  if (!a) return;
  a.style.display = m ? 'block' : 'none';
  a.textContent = m || '';
}

/* Carregar snapshot local se API falhar */
async function carregarSnapshot() {
  try {
    const rs = await fetch('../data/candidatos-2026.json');
    if (!rs.ok) throw new Error('HTTP ' + rs.status);
    SNAP = await rs.json();
    /* O TSE publica o mesmo candidato em arquivos diferentes, então o
       snapshot local repete sq. Sem esta dedup, LULA e FLAVIO apareciam
       duas vezes na lista. */
    if (SNAP && Array.isArray(SNAP.candidatos)) {
      const vistos = new Set();
      SNAP.candidatos = SNAP.candidatos.filter(c => {
        const k = [c.cargo, c.uf, c.sq || c.numero].join('|');
        if (vistos.has(k)) return false;
        vistos.add(k);
        return true;
      });
    }
    /* Fotos oficiais verificadas: o snapshot do TSE não tem foto, então sem
       isto a lista local caía no avatar de iniciais. */
    try {
      const rf = await fetch('../data/fotos-candidatos-2026.json');
      if (rf.ok) {
        const fotos = await rf.json();
        const nk = n => String(n||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
        const achar = (obj, nome) => {
          if (!obj) return '';
          if (obj[nome]) return obj[nome];
          for (const k of Object.keys(obj)) if (nk(k) === nome) return obj[k] || '';
          return '';
        };
        (SNAP.candidatos || []).forEach(c => {
          if (c.foto) return;
          const nome = nk(c.nomeUrna || c.nomeCivil);
          if (!nome) return;
          const cargo = String(c.cargo);
          if (cargo === '1' || cargo === '9') c.foto = achar(fotos.presidente, nome);
          else if (fotos.governadores && fotos.governadores[c.uf]) c.foto = achar(fotos.governadores[c.uf], nome);
          else if (fotos.eleitos_1_turno && fotos.eleitos_1_turno[c.uf]) c.foto = achar(fotos.eleitos_1_turno[c.uf], nome);
        });
      }
    } catch (_) {}
    modoDemo = false;
    console.log('✅ Snapshot local carregado:', SNAP.candidatos ? SNAP.candidatos.length : 0, 'candidatos');
    return SNAP;
  } catch (e) {
    console.error('❌ Falha ao carregar snapshot:', e.message);
    modoDemo = true;
    return null;
  }
}

/* Renderizar card de candidato */
function card(c, i) {
  const sit = (c.situacao || '').toUpperCase();
  const cls = sit.includes('INDEF') ? 'red' : (sit.includes('DEFERIDO') ? 'ok' : 'amb');
  const nome = c.nomeUrna || c.nomeCivil || '?';
  /* Sem foto no snapshot do TSE, um <img src=""> aparece como imagem
     quebrada. Usamos a inicial em círculo, como na página de Eleições. */
  const avatar = c.foto
    ? `<img class="av" src="${c.foto}" alt="" style="width:50px;height:50px;border-radius:12px;object-fit:cover" onerror="this.outerHTML='<div class=&quot;av&quot; style=&quot;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#1a1400;background:var(--gold)&quot;>${(nome[0]||'?').toUpperCase()}</div>'">`
    : `<div class="av" style="width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#1a1400;background:var(--gold)">${(nome[0]||'?').toUpperCase()}</div>`;

  return `<div class="card" onclick="abrirIdx(${i})" style="cursor:pointer;transition:transform 0.15s ease">
    <div style="display:flex;gap:12px;align-items:center">
      ${avatar}
    </div>
    <div style="flex:1">
      <b style="font-size:14.5px">${nome}</b>
      <div class="muted" style="margin-top:2px">${c.numero||''} · <b>${c.partido||''}</b> · ${c.uf||''}${c.idade?' · '+c.idade+' anos':''}${c.ocupacao?' · '+c.ocupacao:''}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap">
      <span class="badge ${cls}" style="display:inline-block">${c.situacao||'—'}</span>
      <span style="font-size:12px;font-weight:700;color:var(--green,#2ECC71)">💰 Fundo: ${c.fundoEleitoralRecebido?'R$ '+Number(c.fundoEleitoralRecebido).toLocaleString('pt-BR'):'Não declarado'}</span>
    </div>
  </div></div>`;
}

/* Renderizar lista */
function render(arr) {
  LAST = arr;
  $('#info').textContent = total + ' candidato(s) — mostrando ' + arr.length + ' nesta página.';
  $('#lista').innerHTML = arr.map((c,i)=>card(c,i)).join('') || '<p class="muted">Nenhum candidato encontrado.</p>';
}

/* Abre o modal de confirmação para o candidato clicado.
   O onclick do card chamava abrirIdx(), que não existia nesta página —
   o clique morria com ReferenceError e nada acontecia. */
let VOTANDO = null;
function abrirIdx(i) {
  const c = LAST[i];
  if (!c) return;
  VOTANDO = c;
  const nome = c.nomeUrna || c.nomeCivil || '—';
  $('#confirm-name').textContent = nome;
  $('#confirm-party').textContent = [c.numero ? 'Nº ' + c.numero : '', c.partido || '', c.uf || ''].filter(Boolean).join(' · ');
  const ph = $('#confirm-photo');
  if (c.foto) { ph.src = c.foto; ph.style.display = ''; } else { ph.removeAttribute('src'); ph.style.display = 'none'; }
  $('#confirm-modal').classList.remove('hidden');
}
function fecharConfirmacao() {
  $('#confirm-modal').classList.add('hidden');
  VOTANDO = null;
}
function confirmarVoto() {
  if (!VOTANDO) return;
  const c = VOTANDO;
  const nome = c.nomeUrna || c.nomeCivil || '—';
  fecharConfirmacao();
  aviso('✅ Voto registrado em ' + nome + ' (modo demonstrativo)');
}

/* Buscar candidatos da API */
async function buscar(p) {
  page = Math.max(1,p);
  $('#info').textContent = 'Carregando…';
  $('#lista').innerHTML = '';
  
  // Primeiro tenta API do servidor
  try {
    const cargo = $('#cargo-select').value;
    const ufSel = $('#uf-select').value;
    /* Presidente/Vice têm uf=BR no TSE: filtrar por um UF estadual os oculta.
       UF vazio = todos (a API compara c.uf === q.uf). */
    const ufBusca = (cargo === '1' || cargo === '9') ? 'BR' : ufSel;
    const url = `${API}/api/candidatos-tse?cargo=${cargo}&uf=${ufBusca}&page=${page}&pageSize=${PS}`;
    /* Sem cache:'force-cache': a API responde no-store, e forçar o cache
       devolvia resposta velha (ou 429) mesmo com o servidor atualizado. */
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    
    let arr;
    if (Array.isArray(j)) { arr = j; total = arr.length; }
    else { arr = j.candidatos || j.dados || []; total = j.total != null ? j.total : arr.length; }
    
    if (arr.length > 0) {
      modoDemo = false;
      render(arr);
      $('#pgAnt').disabled = page <= 1;
      $('#pgProx').disabled = page >= Math.ceil(total / PS);
      $('#pgInfo').textContent = 'Página ' + page + ' de ' + Math.ceil(total / PS);
    } else {
      throw new Error('Nenhum resultado da API');
    }
  } catch (e) {
    // Fallback para snapshot local
    console.warn('⚠️ API indisponível, usando snapshot local:', e.message);
    modoDemo = true;
    try {
      if (!SNAP) await carregarSnapshot();
      if (SNAP && SNAP.candidatos) {
        let lista = SNAP.candidatos;
        const cargo = $('#cargo-select').value;
        const ufSel = $('#uf-select').value;
        if (cargo) lista = lista.filter(c => String(c.cargo) === String(cargo));
        if (ufSel) lista = lista.filter(c => c.uf === ufSel);
        if (lista.length > 0) {
          total = lista.length;
          render(lista.slice((page-1)*PS, page*PS));
          $('#pgAnt').disabled = page <= 1;
          $('#pgProx').disabled = page >= Math.ceil(total / PS);
          $('#pgInfo').textContent = 'Página ' + page + ' de ' + Math.ceil(total / PS) + ' (modo snapshot)';
          aviso('📦 Modo snapshot: dados locais (backend temporariamente indisvolúvel)');
        }
      }
    } catch(e2) {
      $('#info').textContent = '❌ Erro: ' + e2.message;
      $('#lista').innerHTML = '<p class="muted">Não foi possível carregar candidatos nem da API nem do snapshot local.</p>';
    }
  }
}

/* Inicializar */
document.addEventListener('DOMContentLoaded', () => {
  $('#cargo-select').addEventListener('change', () => { page=1; buscar(1); });
  $('#uf-select').addEventListener('change', () => { page=1; buscar(1); });
  $('#cancel-vote').addEventListener('click', fecharConfirmacao);
  $('#confirm-vote').addEventListener('click', confirmarVoto);
  /* clique fora do conteúdo do modal também cancela */
  $('#confirm-modal').addEventListener('click', ev => { if (ev.target === ev.currentTarget) fecharConfirmacao(); });
  buscar(1);
});
</script>
</body>
</html>
